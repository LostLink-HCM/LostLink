name: LostLink CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Không hủy giữa chừng một lần deploy trên main
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    name: Format (prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run format:check

  backend:
    name: Backend (lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Test chạy với MongoDB trong bộ nhớ, giữ file MongoDB đã tải giữa các lần chạy
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
      - run: npm test
        env:
          MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    env:
      MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      # Playwright tự khởi động backend (MongoDB trong bộ nhớ) và bản build của frontend
      - name: Run E2E tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/tests/report
          retention-days: 7

  audit:
    name: Audit (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm audit --audit-level=high

  docker:
    name: Docker (${{ matrix.dir }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        dir: [backend, frontend]
    env:
      IMAGE: lostlink-${{ matrix.dir }}:${{ github.sha }}
      TRIVY_VERSION: 0.76.1
      TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: >-
          docker build --tag "$IMAGE"
          --build-arg "GIT_SHA=${{ github.sha }}"
          --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}"
          --label "org.opencontainers.image.revision=${{ github.sha }}"
          ${{ matrix.dir }}
      - name: Install Trivy
        run: |
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfLO --retry 3 --retry-all-errors --retry-delay 5 "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
          echo "${TRIVY_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" trivy
      - name: Scan image (SARIF report)
        run: ./trivy image --scanners vuln --ignore-unfixed --format sarif --output trivy.sarif "$IMAGE"
      - name: Upload scan to Security tab
        if: github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.dir }}
      - name: Fail on HIGH/CRITICAL
        run: ./trivy image --skip-db-update --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 "$IMAGE"
      - name: Save backend image for publish
        if: matrix.dir == 'backend' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save "$IMAGE" | gzip > backend-image.tar.gz
      - if: matrix.dir == 'backend' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: backend-image
          path: backend-image.tar.gz
          retention-days: 1

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO --retry 3 --retry-all-errors --retry-delay 5 "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" gitleaks
      - name: Scan git history
        run: ./gitleaks git --redact --verbose

  # Chỉ chạy trên main khi mọi job khác xanh: đẩy đúng image đã quét lên GHCR rồi báo Render deploy
  publish:
    name: Publish & deploy backend
    needs: [format, backend, frontend, e2e, audit, docker, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # GitHub tự ghi một lần deploy vào mục Deployments / Environments của repo. Dùng lại
    # environment "main - lostlink-api" (cùng kiểu tên Render đặt, giữ lịch sử deploy cũ)
    # để mục Deployments chỉ có một dòng cho backend
    environment:
      name: main - lostlink-api
      url: https://lostlink-api-158f.onrender.com/api/health
    permissions:
      contents: read
      packages: write
    env:
      LOCAL_IMAGE: lostlink-backend:${{ github.sha }}
      REGISTRY_IMAGE: ghcr.io/lostlink-hcm/lostlink-api
      API_URL: https://lostlink-api-158f.onrender.com
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: backend-image
      - name: Push image to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gunzip -c backend-image.tar.gz | docker load
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in "${{ github.sha }}" latest; do
            docker tag "$LOCAL_IMAGE" "$REGISTRY_IMAGE:$tag"
            docker push "$REGISTRY_IMAGE:$tag"
          done
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL is not set, skipping deploy"
            exit 0
          fi
          image=$(printf '%s' "$REGISTRY_IMAGE:${{ github.sha }}" | jq -sRr @uri)
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}&imgURL=${image}" > /dev/null
          echo "Deploy triggered for $REGISTRY_IMAGE:${{ github.sha }}"
          echo "TRIGGERED=1" >> "$GITHUB_ENV"
      # Deploy Hook chỉ nhận lệnh rồi trả về ngay, chờ tới khi Render chạy đúng commit này
      # thì job mới xanh. Render deploy lỗi (thiếu biến môi trường, app không khởi động) thì job đỏ
      - name: Wait for Render to serve this commit
        if: env.TRIGGERED == '1'
        timeout-minutes: 12
        run: |
          for attempt in $(seq 1 40); do
            version=$(curl -fsS --max-time 60 "$API_URL/api/health" | jq -r '.version // empty' || true)
            if [ "$version" = "${{ github.sha }}" ]; then
              echo "Render is serving ${{ github.sha }}"
              exit 0
            fi
            echo "Attempt $attempt: live version is '${version:-unavailable}', waiting..."
            sleep 15
          done
          echo "::error::Render did not serve ${{ github.sha }} within the time limit, check the Events tab on Render"
          exit 1
