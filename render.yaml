version: '1'
projects:
  - name: LostLink
    environments:
      - name: Production
        services:
          # Backend chạy image Docker do CI đẩy lên GHCR; CI gọi Deploy Hook kèm tag commit SHA
          - type: web
            name: lostlink-api
            runtime: image
            image:
              url: ghcr.io/lostlink-hcm/lostlink-api:latest
            plan: free
            region: singapore
            healthCheckPath: /api/health
            envVars:
              - key: NODE_ENV
                value: production
              - key: CLIENT_URL
                value: https://lostlink-web.onrender.com
              - key: TRUST_PROXY
                sync: false
              - key: MONGO_URI
                sync: false
              - key: JWT_SECRET
                sync: false
              - key: JWT_REFRESH_SECRET
                sync: false
              - key: GOOGLE_CLIENT_ID
                sync: false
              - key: BREVO_API_KEY
                sync: false
              - key: EMAIL_FROM
                sync: false

          - type: web
            name: lostlink
            runtime: static
            repo: https://github.com/LostLink-HCM/LostLink
            branch: main
            rootDir: frontend
            buildCommand: npm ci && npm run build
            staticPublishPath: dist
            autoDeployTrigger: checksPass
            routes:
              - type: rewrite
                source: /api/*
                destination: https://lostlink-api-158f.onrender.com/api/*
              - type: rewrite
                source: /*
                destination: /index.html
            envVars:
              - key: NODE_VERSION
                value: '24'
              - key: VITE_API_URL
                value: /api
              - key: VITE_GOOGLE_CLIENT_ID
                sync: false
