version: '1'
projects:
  - name: LostLink
    environments:
      - name: Production
        services:
          - type: web
            name: LostLink
            runtime: node
            repo: https://github.com/LostLink-HCM/LostLink
            branch: main
            plan: free
            region: singapore
            rootDir: backend
            buildCommand: npm ci
            startCommand: npm start
            healthCheckPath: /api/health
            autoDeployTrigger: checksPass
            envVars:
              - key: NODE_VERSION
                value: '24'
              - key: NODE_ENV
                value: production
              - key: CLIENT_URL
                value: https://lostlink-web.onrender.com
              - key: TRUST_PROXY
                sync: false
              - key: MONGO_URI
                sync: false
              - key: JWT_SECRET
                sync: false
              - key: JWT_REFRESH_SECRET
                sync: false
              - key: GOOGLE_CLIENT_ID
                sync: false
              - key: BREVO_API_KEY
                sync: false
              - key: EMAIL_FROM
                sync: false

          - type: web
            name: lostlink-web
            runtime: static
            repo: https://github.com/LostLink-HCM/LostLink
            branch: main
            rootDir: frontend
            buildCommand: npm ci && npm run build
            staticPublishPath: dist
            autoDeployTrigger: checksPass
            routes:
              - type: rewrite
                source: /api/*
                destination: https://lostlink-evmi.onrender.com/api/*
              - type: rewrite
                source: /*
                destination: /index.html
            envVars:
              - key: NODE_VERSION
                value: '24'
              - key: VITE_API_URL
                value: /api
              - key: VITE_GOOGLE_CLIENT_ID
                sync: false
