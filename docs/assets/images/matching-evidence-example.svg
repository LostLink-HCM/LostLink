<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 662" width="760" height="662" role="img" aria-labelledby="t d">
<title id="t">Bằng chứng từng tiêu chí của hai ví dụ</title>
<desc id="d">Bài A tổng W = +12.1 bit, bài B tổng W = +3.6 bit. B gần cả thời gian lẫn vị trí nhưng khác giống, khác màu, mô tả không khớp nên bị trừ điểm.</desc>

<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#6f6d68; --grid:#e1e0d9; --axis:#c3c2b7; --panel:#ffffff; --panel-line:#e1e0d9; --pos:#2a78d6; --neg:#e34948; }
@media (prefers-color-scheme: dark) { svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#a3a29b; --grid:#2c2c2a; --axis:#4a4a46; --panel:#242423; --panel-line:#383835; --pos:#3987e5; --neg:#e66767; } }
text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink2); font-size: 13px; }
.title { fill: var(--ink); font-size: 17px; font-weight: 600; }
.tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.lab { fill: var(--ink); }
.val { fill: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.grid { stroke: var(--grid); stroke-width: 1; }
.axis { stroke: var(--axis); stroke-width: 1; }
.guide { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
.bg { fill: var(--surface); }
.panel { fill: var(--panel); stroke: var(--panel-line); stroke-width: 1; }
.anim { visibility: hidden; }
@media (prefers-reduced-motion: no-preference) {
.anim { visibility: visible; }

}
</style>
