# Chạy toàn bộ LostLink (MongoDB + backend + frontend) bằng Docker.
name: lostlink

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - '${MONGO_PORT:-27018}:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    # Dùng chung backend/.env với lúc chạy local; các biến dưới đây ghi đè cho môi trường Docker
    env_file: ./backend/.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/LostLink
      CLIENT_URL: http://localhost:${WEB_PORT:-8888}
      TRUST_PROXY: 1
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8888}:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo-data:
